<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Map | Southern Leyte Explore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>

  <main class="container py-4">
    <h2 class="section-title">Explore Southern Leyte</h2>
    <p class="section-sub">Tap a category to load real places from OpenStreetMap.</p>

    <form id="search-form" class="row g-2 mb-3">
      <div class="col-md-5">
        <input id="search-input" class="form-control rounded-pill" type="search"
               placeholder="Search a place in Southern Leyte...">
      </div>
      <div class="col-md-3">
        <select id="muni-select" class="form-select rounded-pill">
          <option value="">Jump to municipality...</option>
        </select>
      </div>
      <div class="col-6 col-md-2 d-grid"><button class="btn btn-ocean" type="submit">Search</button></div>
      <div class="col-6 col-md-2 d-grid">
        <button id="locate-btn" class="btn btn-outline-secondary rounded-pill" type="button">📍 My location</button>
      </div>
    </form>

    <div id="chips" class="d-flex flex-wrap gap-2 mb-3"></div>
    <div id="status" class="small text-secondary mb-2" aria-live="polite"></div>

    <div class="map-wrap"><div id="map"></div></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
